# 内存吃紧（容器可用约 3G），刻意压低各个 JVM 上限
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.workers.max=2

# 避免某个仓库无响应时整个构建挂死
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=2


kotlin.daemon.jvmargs=-Xmx896m
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# Google 不发布 linux-aarch64 的 build-tools，aapt2 是 x86_64 原生二进制。
# 这里指向用 qemu 模拟运行官方 aapt2 的外壳脚本。
android.aapt2FromMavenOverride=/root/rp/gpt-relay/sdk/build-tools/35.0.0/aapt2

